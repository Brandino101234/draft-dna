[project]
name = "draft-dna"
version = "0.1.0"
description = "NBA draft analytics: pre-draft comps, outcome bands, and Shot DNA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "typer>=0.12",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "nba-api>=1.11.4",
    "rapidfuzz>=3.14.6",
    "unidecode>=1.4.0",
]

[project.scripts]
draft-dna = "draft_dna.pipeline:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-requests",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draft_dna"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["draft_dna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dq: data-quality tests that require a built database (run with `make dq`)",
]
addopts = "-m 'not dq'"

[[tool.mypy.overrides]]
module = ["pandas.*", "nba_api.*", "cbbpy.*", "lifelines.*", "lightgbm.*", "ngboost.*", "pymc.*", "shap.*"]
ignore_missing_imports = true
